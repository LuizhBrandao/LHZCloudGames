services:
  fcg-db:
    image: postgres:16-alpine
    container_name: fcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: LHZCloudGames
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LHZCloudGames"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fcg-network

  fcg-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fcg-api
    restart: unless-stopped
    depends_on:
      fcg-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=fcg-db;Database=LHZCloudGames;Username=postgres;Password=postgres;
      - Jwt__Key=SuperSecretKeyForLHZCloudGamesThatIsLongEnough32Chars!
      - EnableSwagger=true
    healthcheck:
      test: ["CMD-SHELL", "dotnet --version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - fcg-network

  prometheus:
    image: prom/prometheus:latest
    container_name: fcg-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - fcg-api
    networks:
      - fcg-network

  grafana:
    image: grafana/grafana:latest
    container_name: fcg-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - fcg-network

volumes:
  postgres_data:

networks:
  fcg-network:
    driver: bridge
