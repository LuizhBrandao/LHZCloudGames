name: CD - Continuous Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality-gate:
    name: Run Tests (Quality Gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LHZCloudGames/LHZCloudGames.slnx

      - name: Build solution
        run: dotnet build LHZCloudGames/LHZCloudGames.slnx --configuration Release --no-restore

      - name: Execute automated tests
        run: dotnet test LHZCloudGames/LHZCloudGames.slnx --configuration Release --no-build --verbosity normal

  build-and-push:
    name: Build & Push Docker Image
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login no GitHub Packages Container Registry (GHCR - Padrão seguro sem secrets manuais)
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Login no Docker Hub (opcional caso os secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN estejam configurados)
      - name: Log in to Docker Hub (se configurado)
        if: env.DOCKERHUB_USER != '' && env.DOCKERHUB_PASS != ''
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cloud
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy status notification
        run: |
          echo "======================================================="
          echo "🚀 Imagem Docker publicada com sucesso no Container Registry!"
          echo "Imagem: ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "Tags geradas: latest, ${{ github.sha }}"
          echo "Iniciando atualização de contêiner no provedor de nuvem..."
          echo "======================================================="

      # Exemplo de Deploy via Webhook (Render, Railway, AWS App Runner, Azure Webhook)
      - name: Trigger Cloud Deploy Webhook (se configurado)
        if: env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
