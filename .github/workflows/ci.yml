name: CI - Continuous Integration

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches-ignore: [ "main" ]

jobs:
  test-and-validate:
    name: Build and Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LHZCloudGames/LHZCloudGames.slnx

      - name: Build solution (Release)
        run: dotnet build LHZCloudGames/LHZCloudGames.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test LHZCloudGames/LHZCloudGames.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Validate Dockerfile Build
        run: docker build -t lhzcloudgames-api:ci .
